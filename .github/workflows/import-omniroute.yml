name: Import and sync upstream OmniRoute

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-omniroute-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[upstream-sync]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream OmniRoute
        run: |
          git clone --depth 1 https://github.com/ChrisCompton/omniroute.git /tmp/omniroute-upstream

      - name: Import upstream source
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows/import-omniroute.yml' \
            /tmp/omniroute-upstream/ ./

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes to import."
            exit 0
          fi
          git commit -m "[upstream-sync] Import ChrisCompton/omniroute"
          git push origin HEAD:main
