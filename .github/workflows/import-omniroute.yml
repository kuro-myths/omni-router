name: Import and sync upstream OmniRoute

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: upstream-omniroute-sync
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[upstream-sync]')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout destination repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone upstream OmniRoute
        run: |
          git clone --depth 1 https://github.com/ChrisCompton/omniroute.git /tmp/omniroute-upstream

      - name: Import upstream source
        run: |
          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github/workflows/***' \
            /tmp/omniroute-upstream/ ./

      - name: Remove credential-like values from upstream fixtures
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          root = Path(".")
          skipped = {".git", "node_modules", ".next", "dist", "build"}
          for path in root.rglob("*"):
              if not path.is_file() or any(part in skipped for part in path.parts):
                  continue
              try:
                  raw = path.read_bytes()
                  if len(raw) > 2_000_000 or b"\\x00" in raw:
                      continue
                  text = raw.decode("utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              clean = re.sub(r"GOCSPX-[A-Za-z0-9_-]+", "YOUR_GOOGLE_OAUTH_CLIENT_SECRET", text)
              clean = re.sub(r"[0-9]{10,}-[a-z0-9]{20,}\\.apps\\.googleusercontent\\.com", "YOUR_GOOGLE_OAUTH_CLIENT_ID.apps.googleusercontent.com", clean)
              if clean != text:
                  path.write_text(clean, encoding="utf-8")
          PY

      - name: Commit imported source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No upstream changes to import."
            exit 0
          fi
          git commit -m "[upstream-sync] Import ChrisCompton/omniroute"
          git push origin HEAD:main
